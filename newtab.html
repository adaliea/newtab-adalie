<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" type="image/svg+xml" href="icons/doodles/simple/Kawaii-crossaint.svg">
  <script src="js/anti-fouc.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body>
  <div id="sky-gradient"></div>

  <div id="corner-doodles">
    <div class="corner-doodle corner-doodle--tl"></div>
    <div class="corner-doodle corner-doodle--tr"></div>
    <div class="corner-doodle corner-doodle--bl"></div>
    <div class="corner-doodle corner-doodle--br"></div>
  </div>

  <a href="settings.html" class="settings-link" title="Settings">&#9881;</a>

  <div class="page">
    <section class="hero" id="widget-clock">
      <div class="hero-left">
        <div class="greeting"></div>
        <div class="time"></div>
        <div class="date"></div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-weather" id="widget-weather">
        <div class="hero-weather-loading">...</div>
      </div>
    </section>

    <nav class="quick-links" id="quick-links"></nav>

    <section class="sites-section" id="sites-section">

      <div class="sites-header">
        <div class="sites-grid" id="sites-grid"></div>
        <button class="sites-add-btn" id="add-site-btn" title="Pin a site" style="margin-left: 1.1rem">+</button>
      </div>
      <div class="pin-form" id="pin-form" hidden>
        <input type="text" id="pin-name" placeholder="Name" class="pin-input">
        <input type="url" id="pin-url" placeholder="https://..." class="pin-input">
        <button class="btn-connect" id="pin-save">Add</button>
        <button class="pin-cancel" id="pin-cancel">Cancel</button>
      </div>
    </section>

    <div class="columns">
      <div class="column-main">
        <section class="widget" id="widget-calendar">
          <div class="widget-header"><a href="https://calendar.google.com" class="widget-header-link">Calendar</a></div>
          <div class="widget-content widget-loading">Loading...</div>
        </section>

        <section class="widget" id="widget-tasks">
          <div class="widget-header"><a href="https://tasks.google.com" class="widget-header-link">Tasks</a></div>
          <div class="widget-content widget-loading">Loading...</div>
        </section>
        <div>
          <section class="widget" id="widget-github">
            <div class="widget-header"><a href="https://github.com" class="widget-header-link">GitHub</a></div>
            <div class="widget-content widget-loading">Loading...</div>
          </section>

          <section class="widget" id="widget-announcements">
            <div class="widget-header"><a class="widget-header-link canvas-header-link">Canvas — Announcements</a></div>
            <div class="widget-content widget-loading">Loading...</div>
          </section>
        </div>


        <section class="widget" id="widget-canvas">
          <div class="widget-header"><a class="widget-header-link canvas-header-link">Canvas — Assignments</a></div>
          <div class="widget-content widget-loading">Loading...</div>
        </section>


      </div>

      <div class="column-divider"></div>

      <div class="column-fun">
        <section class="widget widget--fun" id="widget-lastfm">
          <div class="widget-header"><a class="widget-header-link lastfm-header-link">Last.fm</a></div>
          <div class="widget-content widget-loading">Loading...</div>
        </section>

        <section class="widget widget--fun" id="widget-xkcd">
          <div class="widget-header"><a href="https://xkcd.com" class="widget-header-link">xkcd</a></div>
          <div class="widget-content widget-loading">Loading...</div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="js/newtab.js"></script>
</body>
</html>
